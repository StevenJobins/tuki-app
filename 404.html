<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Tuki Family</title>
  <script>
    // GitHub Pages kennt nur statische Dateien: unbekannte Pfade landen hier.
    // Wir packen den Pfad in die Query und index.html stellt ihn wieder her.
    (function () {
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <p>Weiterleitung...</p>
</body>
</html>
