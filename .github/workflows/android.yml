name: Android Bundle bauen

# Baut das Android App Bundle (.aab) fuer den Play Store.
# Sind die Secrets hinterlegt, ist es signiert und direkt hochladbar.
# Ohne Secrets entsteht ein unsigniertes Bundle plus Debug-APK zum Testen.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsname, z.B. 1.0.0'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Abhaengigkeiten
        run: npm install

      - name: Web-Build
        run: npm run build

      - name: Nach Android kopieren
        run: npx cap sync android

      - name: Firebase-Konfiguration einsetzen (fuer Push)
        if: env.GOOGLE_SERVICES_B64 != ''
        run: printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json

      - name: Upload-Key einsetzen
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Bundle bauen
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Debug-APK bauen (zum Testen auf dem Geraet)
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tuki-family-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
