name: iOS Build und TestFlight

# Baut das iOS-Archiv und laedt es direkt zu App Store Connect hoch.
# Signiert wird ueber einen App-Store-Connect-API-Schluessel, Xcode legt
# Zertifikat und Profil selbst an (-allowProvisioningUpdates).
#
# Benoetigte Repository-Secrets:
#   APPLE_TEAM_ID    zehnstellige Team-ID aus dem Apple Developer Portal
#   ASC_KEY_ID       Key-ID des API-Schluessels
#   ASC_ISSUER_ID    Issuer-ID (steht ueber der Schluesselliste)
#   ASC_KEY_P8_BASE64  die .p8-Datei, base64-kodiert
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsname, z.B. 1.0.0'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'ios-v*'

jobs:
  build:
    runs-on: macos-15
    env:
      MARKETING_VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xcode waehlen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Abhaengigkeiten
        run: npm install

      - name: Web-Build
        run: npm run build

      - name: Nach iOS kopieren
        run: npx cap sync ios

      - name: API-Schluessel ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archiv bauen
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Exportieren und zu App Store Connect hochladen
        working-directory: ios/App
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ../ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Aufraeumen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuki-family-ios
          path: |
            ${{ runner.temp }}/export/**
          retention-days: 30
          if-no-files-found: ignore
